name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
  schedule:
    - cron: "30 5 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      # SMTP 邮件通知（可选，全部配置后生效）
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Write multi-account configuration
        shell: bash
        env:
          COOKIE_1: ${{ secrets.DOUYIN_COOKIE_ACCOUNT1 }}
          CONFIG_1: ${{ secrets.DOUYIN_CONFIG_ACCOUNT1 }}
          COOKIE_2: ${{ secrets.DOUYIN_COOKIE_ACCOUNT2 }}
          CONFIG_2: ${{ secrets.DOUYIN_CONFIG_ACCOUNT2 }}
          COOKIE_3: ${{ secrets.DOUYIN_COOKIE_ACCOUNT3 }}
          CONFIG_3: ${{ secrets.DOUYIN_CONFIG_ACCOUNT3 }}
          COOKIE_4: ${{ secrets.DOUYIN_COOKIE_ACCOUNT4 }}
          CONFIG_4: ${{ secrets.DOUYIN_CONFIG_ACCOUNT4 }}
          COOKIE_5: ${{ secrets.DOUYIN_COOKIE_ACCOUNT5 }}
          CONFIG_5: ${{ secrets.DOUYIN_CONFIG_ACCOUNT5 }}
          LEGACY_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          LEGACY_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          mkdir -p config/tasks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if not any(os.environ.get(f"COOKIE_{i}") for i in range(1, 6)):
              # 没有配置任何多账号 Secret（DOUYIN_COOKIE_ACCOUNTn）：
              # 保持旧单账号模式，不用生成 accounts.json。
              print("未配置多账号 Secret，继续使用旧单账号模式")
              raise SystemExit(0)

          accounts = []
          for index in range(1, 6):
              if index == 1 and not os.environ.get("COOKIE_1") and not os.environ.get("CONFIG_1"):
                  # 没有配置 DOUYIN_COOKIE_ACCOUNT1 时，旧 DOUYIN_COOKIE /
                  # DOUYIN_CONFIG 自动作为账号1，方便老用户无缝添加新账号。
                  cookie = os.environ.get("LEGACY_COOKIE")
                  config = os.environ.get("LEGACY_CONFIG")
              else:
                  cookie = os.environ.get(f"COOKIE_{index}")
                  config = os.environ.get(f"CONFIG_{index}")
              if not cookie and not config:
                  continue
              if not cookie or not config:
                  raise SystemExit(
                      f"账号 account{index} 的 DOUYIN_COOKIE_ACCOUNT{index} 与 "
                      f"DOUYIN_CONFIG_ACCOUNT{index} 必须同时配置"
                  )
              # 提前校验，出错时直接指出是哪个 Secret，避免任务执行中才暴露
              try:
                  json.loads(cookie)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_COOKIE_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              try:
                  json.loads(config)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_CONFIG_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              env_file = f".env.account{index}"
              # Cookie 用 JSON 字符串转义后写入，dotenv 可原样解析，
              # 兼容多组 Cookie JSON 和 # 等特殊字符
              Path(env_file).write_text(
                  f"DOUYIN_COOKIE={json.dumps(cookie)}\nTASK_CONFIG=config/tasks/account{index}.json\n",
                  encoding="utf-8",
              )
              Path(f"config/tasks/account{index}.json").write_text(config, encoding="utf-8")
              # 写入每个账号的 SMTP 配置（如果配置了的话）
              smtp_server = os.environ.get("SMTP_SERVER", "")
              smtp_port = os.environ.get("SMTP_PORT", "")
              smtp_user = os.environ.get("SMTP_USER", "")
              smtp_pass = os.environ.get("SMTP_PASS", "")
              smtp_to = os.environ.get("SMTP_TO", "")
              if smtp_server and smtp_port and smtp_pass:
                  with open(env_file, "a", encoding="utf-8") as f:
                      f.write(f"SMTP_SERVER={smtp_server}\n")
                      f.write(f"SMTP_PORT={smtp_port}\n")
                      f.write(f"SMTP_USER={smtp_user}\n")
                      f.write(f"SMTP_PASS={smtp_pass}\n")
                      f.write(f"SMTP_TO={smtp_to}\n")
              accounts.append({"id": f"account{index}", "enabled": True, "env_file": env_file})
          Path("config/accounts.json").write_text(
              json.dumps({"accounts": accounts}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Debug SMTP environment
        shell: bash
        run: |
          echo "=== SMTP Environment Variables ==="
          echo "SMTP_SERVER=[${SMTP_SERVER}]"
          echo "SMTP_PORT=[${SMTP_PORT}]"
          echo "SMTP_USER=[${SMTP_USER}]"
          echo "SMTP_PASS set: $([ -n "$SMTP_PASS" ] && echo yes || echo no)"
          echo "SMTP_TO=[${SMTP_TO}]"
          echo ""
          echo "=== Running debug script ==="
          python debug_env.py
          echo ""
          echo "=== Debug result file ==="
          cat debug_env_result.txt 2>/dev/null || echo "File not found"
      - name: Run
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-debug-${{ github.run_id }}
          path: |
            artifacts/
            debug_env_result.txt
          retention-days: 3
